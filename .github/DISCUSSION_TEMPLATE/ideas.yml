title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what would make Shell'Naga better for you. Search the existing ideas first and add your vote or details
        there. A bug belongs in [Issues](https://github.com/shellnaga/feedback/issues/new/choose).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead? (optional)
    validations:
      required: false
